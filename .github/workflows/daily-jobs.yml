name: Daily AI Job Hunter
on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
jobs:
  daily-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python daily_runner.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          DAILY_DATA_REPO: ${{ secrets.DAILY_DATA_REPO }}
          DAILY_GITHUB_TOKEN: ${{ secrets.DAILY_GITHUB_TOKEN }}
          DAILY_EMAIL_TO: ${{ secrets.DAILY_EMAIL_TO }}
          DAILY_APP_URL: https://ai-job-hunter.streamlit.app/
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
